# Builds the website of the book "Vertex Operator Algebras in Lean" and publishes it with GitHub Pages.
# This repository holds only the site's code (site/). The workflow fetches the public library Fedor-Popov/Lean_VOA at
# the release tag BOOK_REF, builds the site from its book (Notes/Textbook) and sources, and deploys it. Source links on
# the site point at the public repository at that tag.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Website

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BOOK_REPO: Fedor-Popov/Lean_VOA
  BOOK_REF: v1.05

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site-src
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BOOK_REPO }}
          ref: ${{ env.BOOK_REF }}
          path: book
          fetch-depth: 0 # tags, so that source links point at the release tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site from the book
        run: |
          cp -R site-src/site book/site
          cd book
          python3 site/build.py
          rm -rf site/.cache
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
